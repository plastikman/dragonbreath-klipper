# DragonBreath chamber heater — Klipper config fragment.
# Include this from printer.cfg:  [include dragonbreath.cfg]
# Set `host` to your DragonBreath device IP (or dragonbreath.local).

[dragonbreath]
host: 10.168.2.53
#port: 80
#token: web            # match the device's NVS ctl_token if you set one
#poll_interval: 2.0      # API v2 polling fallback / retry base interval
#register_macros: True # registers M141/M191

[heater_generic dragonbreath]
heater_pin: dragonbreath:pwm
sensor_type: dragonbreath
control: watermark
max_delta: 2.0
min_temp: 0
max_temp: 75           # firmware hard-caps target at 70 C

[verify_heater dragonbreath]
check_gain_time: 300   # PTC chamber heaters are slow
hysteresis: 5
heating_gain: 1

# Fan-only chamber filtration. The blower is on/off only (a zero-cross TRIAC that
# is never phase-chopped), so it's exposed as a BINARY output — a toggle in
# Fluidd/Mainsail, not a misleading speed slider. Drive it from macros with
# SET_PIN PIN=dragonbreath_filter VALUE=1 (e.g. in PRINT_START) and VALUE=0
# (PRINT_END). Fan-only — it never engages the heater.
[output_pin dragonbreath_filter]
pin: dragonbreath:filter
#value: 0             # default off at startup
#shutdown_value: 0    # off on MCU shutdown

# Chamber macros. With `register_macros: True` (default) the module provides M141
# (set) and M191 (set + wait until the target is reached). To define your own
# instead — e.g. to add a release tolerance so a slow PTC chamber's undershoot
# can't hang the wait — set `register_macros: False` above and uncomment these:
#[gcode_macro M141]
#description: Set Chamber Temperature
#gcode:
#    {% set s = params.S|default(0)|float %}
#    SET_HEATER_TEMPERATURE HEATER="dragonbreath" TARGET={s}
#
#[gcode_macro M191]
#description: Wait for Chamber Temperature (R = release temp, defaults to S-5)
#gcode:
#    {% set s = params.S|default(0)|float %}
#    {% set r = params.R|default(0)|float %}
#    {% if r <= 0 %}{% set r = s - 5 %}{% endif %}
#    {% set r = [r, s]|min %}
#    M141 S{s}
#    TEMPERATURE_WAIT SENSOR="heater_generic dragonbreath" MINIMUM={r}
