# OpenBreath chamber heater — Klipper config fragment.
# Include this from printer.cfg:  [include openbreath.cfg]
# Set `host` to your OpenBreath device IP (or openvent.local).

[openbreath]
host: 10.168.2.53
#port: 80
#token: web            # match the device's NVS ctl_token if you set one
#poll_interval: 2.0
#register_macros: True # registers M141/M191

[heater_generic openbreath]
heater_pin: openbreath:pwm
sensor_type: openbreath
control: watermark
max_delta: 2.0
min_temp: 0
max_temp: 75           # firmware hard-caps target at 70 C

[verify_heater openbreath]
check_gain_time: 300   # PTC chamber heaters are slow
hysteresis: 5
heating_gain: 1
